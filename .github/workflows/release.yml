name: Release iso.zip

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sh scripts/zip.sh iso.zip
      - name: Attach iso.zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" iso.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" iso.zip --title "$GITHUB_REF_NAME" --generate-notes
          fi
